# Servidor do PWA: só arquivos estáticos. Não faz proxy de /api; quem manda /api
# para a API é o Gateway (Kubernetes) ou o gateway do compose (infra/compose/gateway.conf).
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    server_tokens off;

    include /etc/nginx/snippets/security-headers.conf;

    gzip on;
    gzip_min_length 512;
    gzip_types text/css application/javascript application/manifest+json image/svg+xml application/json;

    # Probe do Kubernetes e healthcheck do compose
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # "expires" (e não add_header) para não anular os cabeçalhos de segurança herdados.
    # Sem nome de arquivo com hash, HTML/JS/CSS revalidam sempre (ETag -> 304 barato);
    # quem deixa o app rápido e offline é o service worker.
    location = /sw.js {
        expires -1;
    }

    # nginx 1.24 ainda não conhece .webmanifest; nas versões novas o tipo é o mesmo
    location = /manifest.webmanifest {
        default_type application/manifest+json;
        expires -1;
    }

    location /fonts/ {
        expires 30d;
    }

    location /icons/ {
        expires 7d;
    }

    location / {
        expires -1;
        try_files $uri $uri/ /index.html;
    }
}
