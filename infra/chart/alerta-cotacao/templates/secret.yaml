{{- if not .Values.secrets.existingSecret }}
{{- $name := include "alerta.secretName" . }}
{{- $existing := dict }}
{{- with lookup "v1" "Secret" .Release.Namespace $name }}
{{- $existing = .data | default dict }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels:
    {{- include "alerta.labels" . | nindent 4 }}
  annotations:
    # Fica após um "helm uninstall": o volume do Postgres também fica, e um reinstall
    # com senha nova não abriria mais o banco antigo.
    helm.sh/resource-policy: keep
type: Opaque
data:
  APP_TOKEN: {{ include "alerta.secretValue" (list $existing "APP_TOKEN" .Values.secrets.appToken true) | quote }}
  CHECKER_TOKEN: {{ include "alerta.secretValue" (list $existing "CHECKER_TOKEN" .Values.secrets.checkerToken true) | quote }}
  POSTGRES_PASSWORD: {{ include "alerta.secretValue" (list $existing "POSTGRES_PASSWORD" .Values.secrets.postgresPassword true) | quote }}
  NTFY_TOPIC: {{ include "alerta.secretValue" (list $existing "NTFY_TOPIC" .Values.secrets.ntfyTopic false) | quote }}
  NTFY_TOKEN: {{ include "alerta.secretValue" (list $existing "NTFY_TOKEN" .Values.secrets.ntfyToken false) | quote }}
  BRAPI_TOKEN: {{ include "alerta.secretValue" (list $existing "BRAPI_TOKEN" .Values.secrets.brapiToken false) | quote }}
  AWESOMEAPI_TOKEN: {{ include "alerta.secretValue" (list $existing "AWESOMEAPI_TOKEN" .Values.secrets.awesomeapiToken false) | quote }}
  TELEGRAM_BOT_TOKEN: {{ include "alerta.secretValue" (list $existing "TELEGRAM_BOT_TOKEN" .Values.secrets.telegramBotToken false) | quote }}
  TELEGRAM_CHAT_ID: {{ include "alerta.secretValue" (list $existing "TELEGRAM_CHAT_ID" .Values.secrets.telegramChatId false) | quote }}
{{- end }}
