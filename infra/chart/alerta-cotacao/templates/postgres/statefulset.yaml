{{- if .Values.postgres.enabled }}
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "alerta.fullname" . }}-postgres
  labels:
    {{- include "alerta.componentLabels" (list . "postgres") | nindent 4 }}
spec:
  serviceName: {{ include "alerta.fullname" . }}-postgres-hl
  replicas: 1 # banco simples para estudo; para alta disponibilidade, um operator (CloudNativePG)
  selector:
    matchLabels:
      {{- include "alerta.componentSelector" (list . "postgres") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "alerta.componentLabels" (list . "postgres") | nindent 8 }}
      {{- with include "alerta.secretChecksum" . }}
      annotations:
        {{- . | nindent 8 }}
      {{- end }}
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 60
      securityContext:
        {{- include "alerta.podSecurity" 70 | nindent 8 }} # 70 = usuário postgres da imagem alpine
        fsGroup: 70
      containers:
        - name: postgres
          image: {{ .Values.postgres.image }}
          imagePullPolicy: {{ .Values.global.imagePullPolicy }}
          ports:
            - name: postgres
              containerPort: 5432
          env:
            - name: POSTGRES_DB
              value: {{ .Values.postgres.database | quote }}
            - name: POSTGRES_USER
              value: {{ .Values.postgres.username | quote }}
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "alerta.secretName" . }}
                  key: POSTGRES_PASSWORD
          readinessProbe:
            exec:
              command: ["sh", "-c", "pg_isready -h 127.0.0.1 -U \"$POSTGRES_USER\" -d \"$POSTGRES_DB\""]
            periodSeconds: 10
          livenessProbe:
            exec:
              command: ["sh", "-c", "pg_isready -h 127.0.0.1 -U \"$POSTGRES_USER\" -d \"$POSTGRES_DB\""]
            initialDelaySeconds: 30
            periodSeconds: 30
            failureThreshold: 6
          resources:
            {{- toYaml .Values.postgres.resources | nindent 12 }}
          securityContext:
            {{- include "alerta.containerSecurity" . | nindent 12 }}
          volumeMounts:
            # Postgres 18: os dados ficam em /var/lib/postgresql/18/docker (PGDATA da imagem);
            # o volume vai em /var/lib/postgresql, não mais em .../data.
            - name: data
              mountPath: /var/lib/postgresql
            - name: run
              mountPath: /var/run/postgresql
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: run
          emptyDir: {}
        - name: tmp
          emptyDir: {}
  volumeClaimTemplates:
    - metadata:
        name: data
        labels:
          {{- include "alerta.componentSelector" (list . "postgres") | nindent 10 }}
      spec:
        accessModes: [ReadWriteOnce]
        {{- with .Values.postgres.storageClassName }}
        storageClassName: {{ . }}
        {{- end }}
        resources:
          requests:
            storage: {{ .Values.postgres.storage }}
{{- end }}
