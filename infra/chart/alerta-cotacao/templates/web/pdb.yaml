{{- if gt (int .Values.web.replicas) 1 }}
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "alerta.fullname" . }}-web
  labels:
    {{- include "alerta.componentLabels" (list . "web") | nindent 4 }}
spec:
  maxUnavailable: 1
  selector:
    matchLabels:
      {{- include "alerta.componentSelector" (list . "web") | nindent 6 }}
{{- end }}
