apiVersion: v1
kind: Service
metadata:
  name: {{ include "alerta.fullname" . }}-web
  labels:
    {{- include "alerta.componentLabels" (list . "web") | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    {{- include "alerta.componentSelector" (list . "web") | nindent 4 }}
  ports:
    - name: http
      port: 8080
      targetPort: http
