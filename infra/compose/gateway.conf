# Gateway local: no compose, faz o papel do Gateway API do cluster.
#   /api/*       -> api:8080   (mesma regra do HTTPRoute do chart)
#   /internal/*  -> 404        (só o checker fala com /internal, por dentro da rede)
#   /actuator/*  -> 404        (o actuator nem está nesta porta; é só cinto e suspensório)
#   resto        -> web:8080   (PWA)
server {
    listen 8080;
    server_name _;
    server_tokens off;
    client_max_body_size 1m;

    # DNS do Docker re-resolvido a cada 10 s: se a API reiniciar e trocar de IP,
    # o gateway acompanha. Com o nome fixo no proxy_pass, o nginx guardaria o IP
    # da subida para sempre.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $api_upstream http://api:8080;
    set $web_upstream http://web:8080;

    # HTTP/1.1 até os serviços: o nginx do PWA não comprime respostas para HTTP/1.0.
    # (proxy_set_header fica todo aqui: um proxy_set_header dentro de location
    # anularia todos os herdados.)
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    location /internal/ {
        return 404;
    }

    location /actuator/ {
        return 404;
    }

    location /api/ {
        proxy_pass $api_upstream;
    }

    location / {
        proxy_pass $web_upstream;
    }
}
