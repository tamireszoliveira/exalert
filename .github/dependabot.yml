# Atualizações semanais: versões das actions, imagens base e dependências da API.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }
    groups:
      actions: { patterns: ["*"] }

  - package-ecosystem: docker
    directories: [/apps/web, /services/api, /services/checker]
    schedule: { interval: weekly }

  - package-ecosystem: maven
    directory: /services/api
    schedule: { interval: weekly }
    groups:
      spring: { patterns: ["org.springframework*"] }
