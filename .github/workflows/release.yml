name: Release

# A cada merge na main: publica as três imagens no GHCR com a MESMA tag (sha-<commit>),
# e, se o deploy estiver ligado, instala essa versão no cluster com o chart.
#
# Deploy ligado = variável de repositório DEPLOY_ENABLED=true + environment "production"
# com o secret KUBECONFIG_B64 (kubeconfig em base64) e a variável APP_HOST (domínio).
# Atenção: este modo "push" exige que a API do cluster seja alcançável pelo runner do
# GitHub. Para não expor o 6443, prefira um runner self-hosted dentro da rede ou GitOps
# (Argo CD/Flux puxando do repositório); veja o README.

on:
  push:
    branches: [main]
    paths:
      - apps/web/**
      - services/**
      - infra/chart/**
      - .github/workflows/release.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  images:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write # publicar no GHCR com o GITHUB_TOKEN
    strategy:
      matrix:
        include:
          - name: web
            context: apps/web
          - name: api
            context: services/api
          - name: checker
            context: services/checker
    steps:
      - uses: actions/checkout@v7
      - name: Dono do repositório em minúsculas (o GHCR exige)
        id: owner
        env:
          OWNER: ${{ github.repository_owner }}
        run: echo "name=${OWNER,,}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v6
        id: meta
        with:
          images: ghcr.io/${{ steps.owner.outputs.name }}/alerta-cotacao-${{ matrix.name }}
          tags: |
            type=sha,prefix=sha-,format=short
            type=raw,value=main
      - uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.context }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}

  deploy:
    needs: images
    if: vars.DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: production
      url: https://${{ vars.APP_HOST }}
    steps:
      - uses: actions/checkout@v7
      - uses: azure/setup-helm@v5
        with:
          version: v4.2.3
      - name: kubeconfig
        env:
          KUBECONFIG_B64: ${{ secrets.KUBECONFIG_B64 }}
        run: |
          mkdir -p ~/.kube
          echo "$KUBECONFIG_B64" | base64 -d > ~/.kube/config
          chmod 600 ~/.kube/config
      - name: helm upgrade (volta sozinho se a versão nova não ficar pronta)
        env:
          OWNER: ${{ github.repository_owner }}
          APP_HOST: ${{ vars.APP_HOST }}
        run: |
          helm upgrade --install alerta infra/chart/alerta-cotacao \
            --namespace alerta --create-namespace \
            -f infra/chart/alerta-cotacao/values-prod.yaml \
            --set "global.imageRegistry=ghcr.io/${OWNER,,}" \
            --set "global.imageTag=sha-${GITHUB_SHA::7}" \
            --set "gateway.hostnames[0]=${APP_HOST}" \
            --rollback-on-failure --timeout 10m
      - name: Teste de fumaça pelo Gateway
        env:
          APP_HOST: ${{ vars.APP_HOST }}
        run: |
          curl -fsS --retry 10 --retry-delay 6 --retry-all-errors "https://${APP_HOST}/healthz"
          status=$(curl -s -o /dev/null -w '%{http_code}' "https://${APP_HOST}/api/alerts")
          echo "GET /api/alerts sem token -> ${status}"
          test "$status" = "401" # API no ar e protegida
