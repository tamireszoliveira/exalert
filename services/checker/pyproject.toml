[project]
name = "alerta-checker"
version = "0.1.0"
description = "Checker do Alerta de Cotação: consulta cotações (AwesomeAPI, brapi) e envia push (ntfy, Telegram)"
requires-python = ">=3.11"
dependencies = [] # só biblioteca padrão, de propósito

[tool.ruff]
line-length = 140
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["alerta_checker"]
known-local-folder = ["fakes", "fake_alerta_api"]
